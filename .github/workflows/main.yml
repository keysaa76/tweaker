name: Build LEVSCLOADES

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Python
        run: |
          python --version
          python -m pip --version
          python -m PyInstaller --version

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --clean `
            --name LEVSCLOADES `
            main.py

      - name: Check EXE
        run: |
          if (!(Test-Path "dist\LEVSCLOADES.exe")) {
            Write-Error "LEVSCLOADES.exe tidak ditemukan!"
            exit 1
          }
          Get-Item "dist\LEVSCLOADES.exe" | Format-List Name,Length,FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: LEVSCLOADES-Windows
          path: dist/LEVSCLOADES.exe
          if-no-files-found: error
